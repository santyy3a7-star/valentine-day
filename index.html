<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#FFDAE9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* ===== ENVELOPE ===== */
#envelopeStage{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.envelope{
    width:250px;
    height:180px;
    background:#f5e6d3;
    border-radius:6px;
    position:relative;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.envelope-flap{
    position:absolute;
    width:100%;
    height:100%;
    background:#e8d5c4;
    clip-path:polygon(0 0,50% 50%,100% 0);
    transition:.8s;
    transform-origin:top;
}

.envelope.opening .envelope-flap{
    transform:rotateX(-170deg);
}

/* ===== MODAL ===== */
.container{
    display:none;
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    text-align:center;
}

body.show-modal .container{
    display:block;
}

.puzzle-grid{
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:2px;
    margin:auto;
}

.puzzle-tile{
    background-size:cover;
    cursor:pointer;
}

.empty{
    background:none;
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:30px;
    background:#FFDAE9;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="envelopeStage">
    <div class="envelope" id="envelope">
        <div class="envelope-flap"></div>
    </div>
</div>

<div class="container">
    <h2>Dear Sofi...</h2>
    <div class="puzzle-grid" id="puzzleGrid"></div>
    <p id="finalText" style="display:none;">...you complete me 💘<br>Will you be my Valentine?</p>
    <button id="yesBtn" style="display:none;">Yes</button>
</div>

<script>
const envelope=document.getElementById("envelope");
const envelopeStage=document.getElementById("envelopeStage");
const puzzleGrid=document.getElementById("puzzleGrid");
const finalText=document.getElementById("finalText");
const yesBtn=document.getElementById("yesBtn");

envelope.addEventListener("click",()=>{
    envelope.classList.add("opening");
    setTimeout(()=>{
        envelopeStage.style.display="none";
        document.body.classList.add("show-modal");
    },800);
});

const EMPTY=9;
let state=[1,2,3,4,5,6,7,8,9];

function shuffle(){
    state.sort(()=>Math.random()-0.5);
}

function render(){
    puzzleGrid.innerHTML="";
    state.forEach((num,i)=>{
        const tile=document.createElement("div");
        tile.className="puzzle-tile";
        if(num===EMPTY){
            tile.classList.add("empty");
        }else{
            tile.style.backgroundImage=`url('./images/tile-${num}.png')`;
            tile.onclick=()=>move(i);
        }
        puzzleGrid.appendChild(tile);
    });
}

function move(i){
    const emptyIndex=state.indexOf(EMPTY);
    const valid=[emptyIndex-1,emptyIndex+1,emptyIndex-3,emptyIndex+3];
    if(valid.includes(i)){
        [state[i],state[emptyIndex]]=[state[emptyIndex],state[i]];
        render();
        checkWin();
    }
}

function checkWin(){
    if(state.join()==="1,2,3,4,5,6,7,8,9"){
        finalText.style.display="block";
        yesBtn.style.display="inline-block";
    }
}

shuffle();
r
